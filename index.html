<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>东方财富条件选股结果 - 静态表格</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --line: #dfe7f1;
      --line-strong: #c7d4e5;
      --text: #1f2937;
      --muted: #65758b;
      --accent: #2454d6;
      --accent-soft: #edf3ff;
      --red: #d8343f;
      --green: #118a55;
      --amber: #9a6500;
      --shadow: 0 12px 28px rgba(31, 41, 55, 0.08);
      --head-row-height: 40px;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 18px 18px 28px;
    }

    @supports (height: 100dvh) {
      .page {
        height: 100dvh;
      }
    }

    .app-header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: end;
      width: 100%;
      margin: 0 0 14px;
      flex: 0 0 auto;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.22;
      font-weight: 750;
      letter-spacing: 0;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(118px, auto));
      gap: 8px;
    }

    .meta-item {
      min-height: 58px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 0 rgba(31, 41, 55, 0.03);
    }

    .meta-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .meta-item strong {
      display: block;
      margin-top: 7px;
      font-size: 16px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .query-band,
    .filter-panel,
    .table-shell {
      width: 100%;
      margin: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .query-band {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(90deg, #ffffff 0%, #f8fbff 48%, #fffaf0 100%);
    }

    .query-controls {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .query-rest {
      color: var(--muted);
      font-weight: 700;
    }

    .remote-count {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 24px;
      padding-left: 8px;
      border-left: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.65;
      white-space: nowrap;
    }

    .remote-count strong {
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      line-height: inherit;
      font-variant-numeric: tabular-nums;
    }

    .band-note {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 2px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .band-note-local {
      color: var(--muted);
    }

    .query-rest {
      flex: 0 0 auto;
      line-height: 1.65;
    }

    .source-link {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--accent);
      font-weight: 700;
    }

    .filter-panel {
      padding: 12px 14px;
      border-top: 0;
      background: #fbfdff;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      align-items: end;
    }

    .filter-grid {
      flex: 1 1 auto;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }

    .range-filter {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      align-items: start;
      min-height: 60px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .online-filter {
      flex: 0 1 260px;
      min-width: 240px;
      min-height: 58px;
      background: #ffffff;
    }

    .range-label {
      overflow: hidden;
      color: #344052;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .range-inputs {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 5px;
      align-items: center;
    }

    .range-input {
      width: 100%;
      min-width: 0;
      height: 27px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #f8fbff;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      text-align: right;
      outline: none;
      padding: 0 7px;
    }

    .range-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 84, 214, 0.12);
    }

    .search-filter .control {
      height: 27px;
      border-radius: 6px;
      background: #f8fbff;
      font-weight: 700;
    }

    .reset-button {
      flex: 0 0 auto;
      width: 58px;
      height: 27px;
      border-radius: 6px;
      border-color: var(--line-strong);
      background: #f8fbff;
      color: var(--accent);
    }

    .control {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 84, 214, 0.12);
    }

    input.control {
      padding: 0 12px;
    }

    select.control {
      padding: 0 34px 0 12px;
    }

    button {
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .table-shell {
      border-top: 0;
      border-radius: 0 0 8px 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .table-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: auto;
      background: #fff;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th,
    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      vertical-align: middle;
    }

    th {
      text-align: center;
    }

    td {
      text-align: right;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 4;
      height: var(--head-row-height);
      padding: 0;
      background: #f2f6fb;
      color: #334155;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    thead tr:nth-child(2) th {
      top: var(--head-row-height);
      background: #f7f9fd;
      color: #6b7a90;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    tbody tr:nth-child(even) td {
      background: #fbfcfe;
    }

    tbody tr:hover td {
      background: var(--accent-soft);
    }

    td {
      height: 44px;
      padding: 5px 10px;
      color: #526073;
      line-height: 1.25;
      white-space: nowrap;
    }

    /*noinspection CssUnusedSymbol*/
    .text-center {
      text-align: center;
    }

    .stock-code,
    .stock-name {
      color: #173fff;
      cursor: pointer;
      font-weight: 650;
    }

    .stock-code:hover,
    .stock-code:focus-visible,
    .stock-name:hover {
      text-decoration: underline;
    }

    tbody tr[data-stock-code] {
      cursor: default;
    }

    tbody tr[data-stock-code]:focus-visible td {
      outline: 2px solid rgba(36, 84, 214, 0.28);
      outline-offset: -2px;
    }

    .cell-main {
      display: block;
      color: inherit;
      font-variant-numeric: tabular-nums;
    }

    .cell-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    /*noinspection CssUnusedSymbol*/
    .value-up .cell-main,
    .value-up {
      color: var(--red);
    }

    /*noinspection CssUnusedSymbol*/
    .value-down .cell-main,
    .value-down {
      color: var(--green);
    }

    .group-head {
      padding: 0;
      text-align: center;
      color: #2f3e54;
    }

    .group-head-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.1;
      text-align: center;
    }

    .th-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: var(--head-row-height);
      padding: 0 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.1;
      text-align: center;
      cursor: pointer;
    }

    .th-button:hover {
      background: rgba(36, 84, 214, 0.08);
      color: var(--accent);
    }

    .th-title {
      display: block;
      width: 100%;
      overflow: hidden;
      line-height: 1.1;
      font-weight: 750;
      text-overflow: ellipsis;
      text-align: center;
    }

    .th-date {
      width: 100%;
      margin-top: 2px;
      overflow: hidden;
      text-align: center;
      line-height: 1.1;
      color: #8995a6;
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
    }

    .sort-mark {
      margin-left: 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
    }

    /*noinspection CssUnusedSymbol*/
    .sticky-col {
      position: sticky;
      z-index: 3;
      box-shadow: 1px 0 0 var(--line);
    }

    /*noinspection CssUnusedSymbol*/
    th.sticky-col {
      z-index: 6;
    }

    /*noinspection CssUnusedSymbol*/
    tbody tr:hover .sticky-col {
      background: var(--accent-soft);
    }

    /*noinspection CssUnusedSymbol*/
    .sticky-serial {
      left: 0;
      min-width: 42px;
      text-align: center;
    }

    /*noinspection CssUnusedSymbol*/
    th.sticky-serial .th-button,
    td.sticky-serial {
      padding-left: 6px;
      padding-right: 6px;
    }

    /*noinspection CssUnusedSymbol*/
    .sticky-code {
      left: var(--sticky-code-left, 52px);
      min-width: 74px;
      text-align: center;
    }

    /*noinspection CssUnusedSymbol*/
    .sticky-name {
      left: var(--sticky-name-left, 126px);
      min-width: 86px;
      text-align: center;
    }

    /*noinspection CssUnusedSymbol*/
    .col-growth,
    .col-contract,
    .col-wide,
    .col-realtime,
    .col-interval-change {
      width: auto;
      min-width: 0;
    }

    .chart-popover {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: min(590px, calc(100vw - 24px));
      border: 1px solid #d6deeb;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 6px, 0);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .chart-popover[hidden] {
      display: none;
    }

    /*noinspection CssUnusedSymbol*/
    .chart-popover.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
    }

    .chart-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      min-height: 70px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
    }

    .chart-name-line {
      display: flex;
      gap: 8px;
      align-items: baseline;
      min-width: 0;
    }

    .chart-title {
      overflow: hidden;
      color: var(--text);
      font-size: 17px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chart-code {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .chart-status {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .chart-quote {
      display: grid;
      justify-items: end;
      gap: 5px;
      min-width: 126px;
    }

    .chart-price {
      color: var(--red);
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .chart-change {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /*noinspection CssUnusedSymbol*/
    .chart-change.value-up,
    .chart-price.value-up {
      color: var(--red);
    }

    /*noinspection CssUnusedSymbol*/
    .chart-change.value-down,
    .chart-price.value-down {
      color: var(--green);
    }

    .chart-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 10px 16px 0;
    }

    .chart-tab {
      height: 28px;
      min-width: 46px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fbff;
      color: #526073;
      font-size: 12px;
      font-weight: 750;
    }

    .chart-tab:hover,
    .chart-tab.is-active {
      border-color: #ff6a2a;
      background: #fff4ed;
      color: #f05a24;
    }

    .chart-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 16px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .chart-meta span,
    .chart-ma span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chart-ma {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 16px 0;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
    }

    .chart-ma-5 {
      color: #c98600;
    }

    .chart-ma-10 {
      color: #df3fd1;
    }

    .chart-ma-20 {
      color: #3d9a62;
    }

    .chart-canvas-wrap {
      position: relative;
      padding: 8px 14px 14px;
    }

    .chart-canvas {
      display: block;
      width: 100%;
      height: 328px;
      border: 1px solid #dfe5ef;
      background: #fff;
    }

    .chart-message {
      position: absolute;
      left: 15px;
      right: 15px;
      top: 9px;
      bottom: 15px;
      display: none;
      place-items: center;
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      text-align: center;
    }

    /*noinspection CssUnusedSymbol*/
    .chart-message.is-visible {
      display: grid;
    }

    .empty-state {
      padding: 40px;
      color: var(--muted);
      text-align: center;
    }

    .table-loading {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-weight: 750;
      line-height: 1.35;
    }

    .table-loading-spinner {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 2px solid #d8e2f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: tableLoadingSpin 0.75s linear infinite;
    }

    @keyframes tableLoadingSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .table-loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.64);
    }

    .table-loading-overlay[hidden] {
      display: none;
    }

    .table-loading-overlay .table-loading {
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.12);
    }

    @media (max-width: 980px) {
      .page {
        padding: 12px;
      }

      .app-header {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 620px) {
      h1 {
        font-size: 21px;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }

      .query-band {
        display: block;
      }

      .query-controls {
        display: grid;
        grid-template-columns: 1fr;
      }

      .band-note {
        white-space: normal;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .filter-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .reset-button {
        justify-self: start;
      }

      .source-link {
        margin-top: 10px;
      }

      .chart-head {
        grid-template-columns: 1fr;
      }

      .chart-quote {
        justify-items: start;
      }

      .chart-meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chart-ma {
        grid-template-columns: 1fr;
      }

      .chart-canvas {
        height: 286px;
      }

    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div>
        <p class="eyebrow">东方财富条件选股</p>
        <h1>合同负债增长筛选结果</h1>
      </div>
      <div class="meta-grid" aria-label="数据概览">
        <div class="meta-item">
          <span>行情时间</span>
          <strong id="quoteTime">-</strong>
        </div>
        <div class="meta-item">
          <span>来源 ID</span>
          <strong id="sourceId">-</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="query-band">
        <div class="query-controls" aria-label="合同负债筛选条件">
          <span class="band-note band-note-remote">远程筛选东财数据</span>
          <span class="remote-count" aria-label="从东方财富筛选出来的股票数量">
            <span>东财筛出</span>
            <strong id="remoteCount">-</strong>
            <span>只</span>
          </span>
          <span class="query-rest">不要ST股及不要退市股；不要北交所</span>
          <label class="range-filter online-filter">
            <span class="range-label">合同负债同比增长率</span>
            <span class="range-inputs">
              <input class="range-input" id="yoyThresholdInput" type="number" step="0.01" value="100" inputmode="decimal" placeholder="最小" aria-label="合同负债同比增长率最小值">
              <input class="range-input" id="yoyMaxInput" type="number" step="0.01" inputmode="decimal" placeholder="最大" aria-label="合同负债同比增长率最大值">
            </span>
          </label>
          <label class="range-filter online-filter">
            <span class="range-label">合同负债环比增长率</span>
            <span class="range-inputs">
              <input class="range-input" id="qoqThresholdInput" type="number" step="0.01" value="100" inputmode="decimal" placeholder="最小" aria-label="合同负债环比增长率最小值">
              <input class="range-input" id="qoqMaxInput" type="number" step="0.01" inputmode="decimal" placeholder="最大" aria-label="合同负债环比增长率最大值">
            </span>
          </label>
        </div>
        <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noreferrer">来源页面</a>
      </section>

      const dividendMetricPrefixes = ["DIVIDEND_NEWRATIO_HYY", "DIVIDEND_PAY_RATIO_HYA"];

      const liveMetricQueryParts = [

      ];

      applyData(emptySource, { type: "loading", error: "" });

        scheduleLiveUpdate(0);

      } else {
        applyData(emptySource, { type: "error", error: "请先配置 Worker 地址，例如 ?api=https://xxx.workers.dev" });
      }

      searchInput.addEventListener("input", render);
      localNumericFilters.forEach(filter => {
        [filter.minInput, filter.maxInput].forEach(input => {
          if (input) input.addEventListener("input", render);
        });

        [filter.minInput, filter.maxInput].forEach(input => {
