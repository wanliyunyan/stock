        });
      });
      resetButton.addEventListener("click", () => {
        searchInput.value = "";
        clearNumericFilters(localNumericFilters);
        render();
      });
      attachChartPreviewEvents();

      function applyData(nextSource, status) {
        activeSource = nextSource || emptySource;
        dataStatus = status;
        rows = Array.isArray(activeSource.rows) ? activeSource.rows.slice() : [];
        displayGroups = buildDisplayGroups(activeSource.columns || []);
        leafColumns = displayGroups.flatMap(group => group.children || [group.column]);
        filterKeys = Object.fromEntries(numericFilters.map(filter => [filter.id, findFilterColumnKey(filter)]));
        setMeta();
        render();
      }

      async function enrichRealtimeQuoteData(source) {
        if (!source || !Array.isArray(source.rows) || !source.rows.length) return source;
        const sourceWithRealtimeDates = applyRealtimeColumnDates(source, source.realtimeQuoteTime || source.quoteTime || source.searchCodeTime);
        let quoteData = null;
        try {
          quoteData = await fetchRealtimeQuotes(sourceWithRealtimeDates.rows);
        } catch (error) {
          console.warn("Realtime quote enrichment failed:", error);
          return sourceWithRealtimeDates;
        }
        if (!quoteData || !Array.isArray(quoteData.rows) || !quoteData.rows.length) return sourceWithRealtimeDates;
        return mergeRealtimeQuoteData(sourceWithRealtimeDates, quoteData);
      }

      function applyRealtimeColumnDates(source, dateText) {
        if (!source || !dateText) return source;
        return {
          ...source,
          columns: (source.columns || []).map(column => applyRealtimeColumnDate(column, dateText))
        };
      }

      function applyRealtimeColumnDate(column, dateText) {
        if (!column) return column;
        if (Array.isArray(column.children)) {
          return { ...column, children: column.children.map(child => applyRealtimeColumnDate(child, dateText)) };
        }
        return realtimeQuoteKeys.includes(column.key) ? { ...column, dateMsg: dateText } : column;
      }

      async function fetchRealtimeQuotes(sourceRows) {
        if (!(location.protocol === "http:" || location.protocol === "https:")) return null;
        const securities = uniqueSecurities(sourceRows);
        if (!securities.length) return null;
        return requestEastmoneyQuotes(securities);
      }

      function mergeRealtimeQuoteData(source, quoteData) {
        const quotesByCode = new Map(quoteData.rows.map(row => [String(row.code || ""), row]));
        const quoteDateTime = quoteData.quoteTime || source.realtimeQuoteTime || source.quoteTime || source.searchCodeTime || quoteData.quoteMinute || "";
        const existingKeys = new Set((source.columns || []).map(column => column.key));
        const quoteColumns = realtimeQuoteKeys
          .filter(key => !existingKeys.has(key))
          .map(key => {
            const template = realtimeQuoteColumnTemplates[key];
            return template ? { ...template, dateMsg: quoteDateTime || template.dateMsg } : null;
          })
          .filter(Boolean);
        const mergedColumns = (source.columns || [])
          .map(column => realtimeQuoteKeys.includes(column.key) ? { ...column, dateMsg: quoteDateTime || column.dateMsg } : column)
          .concat(quoteColumns);
        const mergedRows = source.rows.map(row => {
          const quote = quotesByCode.get(String(row["SECURITY_CODE"] || ""));
          if (!quote) return row;
          const mergedRow = { ...row };
          if (isUsableQuoteValue(quote.newestPrice)) mergedRow.NEWEST_PRICE = formatRealtimeNumber(quote.newestPrice);
          if (isUsableQuoteValue(quote.peDynamic)) mergedRow.PE_DYNAMIC = formatRealtimeNumber(quote.peDynamic);
          if (isUsableQuoteValue(quote.pb)) mergedRow.PB = formatRealtimeNumber(quote.pb);
          if (isUsableQuoteValue(quote.totalMarketValue)) mergedRow["TOAL_MARKET_VALUE<140>"] = formatMarketValue(quote.totalMarketValue);
          return mergedRow;
        });
        return {
          ...source,
          quoteTime: quoteData.quoteTime || source.quoteTime,
          realtimeQuoteTime: quoteData.quoteTime || "",
          columns: mergedColumns,
          rows: mergedRows
        };
      }

      function uniqueSecurities(sourceRows) {
        const seen = new Set();
        return sourceRows.reduce((result, row) => {
          const code = String(row["SECURITY_CODE"] || "").trim();
          if (!/^\d{6}$/.test(code) || seen.has(code)) return result;
          seen.add(code);
          result.push({ code, market: marketCodeForRow(row) });
          return result;
        }, []);
      }

      function marketCodeForRow(row) {
        const market = String(row["MARKET_NUM"] || "").trim();
        if (market === "0" || market === "1") return market;
        return String(row["SECURITY_CODE"] || "").startsWith("6") ? "1" : "0";
      }

      function marketPrefixForRow(row) {
        return marketCodeForRow(row) === "1" ? "sh" : "sz";
      }

      function quoteDetailUrlForRow(row) {
        const code = String(row && row["SECURITY_CODE"] || "").trim();
        if (!/^\d{6}$/.test(code)) return "";
        return `https://quote.eastmoney.com/concept/${marketPrefixForRow(row)}${code}.html`;
      }

      function isUsableQuoteValue(value) {
        return value !== null && value !== undefined && value !== "" && value !== "-";
      }

      function formatRealtimeNumber(value) {
        return typeof value === "number" ? String(value) : String(value || "-");
      }

      function resolveApiBaseUrl() {
        const params = new URLSearchParams(location.search);
        if (params.has("api")) {
          const requested = normalizeApiBaseUrl(params.get("api"));
          try {
            if (requested) window.localStorage.setItem("stock.apiBaseUrl", requested);
            else window.localStorage.removeItem("stock.apiBaseUrl");
          } catch {
            /* ignore storage errors */
          }
          return requested;
        }
        return readStoredApiBaseUrl();
      }

      function readStoredApiBaseUrl() {
        try {
          return normalizeApiBaseUrl(window.localStorage.getItem("stock.apiBaseUrl"));
        } catch {
          return "";
        }
      }

      function normalizeApiBaseUrl(value) {
        return String(value || "").trim().replace(/\/+$/, "");
      }

      function stockApiUrl(path, fallbackUrl) {
        if (apiBaseUrl) return `${apiBaseUrl}${path}`;
        if (isLocalDev) return fallbackUrl;
        throw new Error("请先配置 Worker 地址，例如 ?api=https://xxx.workers.dev");
      }

      async function requestEastmoneyQuotes(securities) {
        const rows = [];
        let latestUpdatedAt = 0;
        for (let index = 0; index < securities.length; index += quoteBatchSize) {
          const batch = securities.slice(index, index + quoteBatchSize);
          const secids = batch.map(item => `${item.market}.${item.code}`).join(",");
          const url = `${stockApiUrl("/api/quotes", eastmoneyQuoteApi)}?fltt=2&invt=2&fields=${quoteFields}&secids=${encodeURIComponent(secids)}`;
          const response = await fetch(url, {
            headers: {
              "Accept": "application/json, text/plain, */*"
            }
          });
          const responseText = await response.text();
          if (!response.ok) {
            throw new Error(responseText || `HTTP ${response.status}`);
          }
          const apiData = parseJsonResponse(responseText, "行情接口返回格式异常");
          const payload = apiData && apiData["data"];
          const diff = payload && payload["diff"];
          if (!Array.isArray(diff)) {
            throw new Error((apiData && apiData["msg"]) || "行情接口未返回数据");
          }
          diff.forEach(item => {
            const updatedAt = Number(item["f124"]) || 0;
            if (updatedAt > latestUpdatedAt) latestUpdatedAt = updatedAt;
            rows.push({
              code: String(item["f12"] || ""),
              market: String(item["f13"] ?? ""),
              name: item["f14"] || "",
              newestPrice: item["f2"],
              totalMarketValue: item["f20"],
              pb: item["f23"],
              peDynamic: item["f115"],
              updatedAt
            });
          });
        }
        return {
          quoteTime: latestUpdatedAt ? formatQuoteDateTime(latestUpdatedAt) : "",
          quoteMinute: latestUpdatedAt ? formatQuoteMinute(latestUpdatedAt) : "",
          rows
        };
      }

      async function requestEastmoneyKlines(stock, period, signal) {
        const selectedPeriod = chartPeriods[period] ? period : "101";
        const params = new URLSearchParams({
          secid: `${stock.market}.${stock.code}`,
          fields1: klineFields1,
          fields2: klineFields2,
          klt: selectedPeriod,
          fqt: "1",
          end: "20500101",
          lmt: String(chartPeriods[selectedPeriod].limit)
        });
        let responseText = "";
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            const response = await fetch(`${eastmoneyKlineApi}?${params.toString()}`, {
              signal,
              cache: "no-store",
              headers: {
                "Accept": "application/json, text/plain, */*"
              }
            });
            responseText = await response.text();
            if (!response.ok) {
              throw new Error(responseText || `HTTP ${response.status}`);
            }
            break;
          } catch (error) {
            if ((error && error.name === "AbortError") || attempt === 2) {
              throw error;
            }
            await new Promise(resolve => window.setTimeout(resolve, 180 * (attempt + 1)));
          }
        }
        const apiData = parseJsonResponse(responseText, "K线接口返回格式异常");
        if (apiData && apiData["rc"] !== 0) {
          throw new Error((apiData && apiData["msg"]) || "K线接口暂时不可用");
        }
        const payload = apiData && apiData["data"];
        const rows = parseKlineRows(payload && payload["klines"]);
        return {
          code: String((payload && payload["code"]) || stock.code || ""),
          market: String((payload && payload["market"]) ?? stock.market ?? ""),
          name: (payload && payload["name"]) || stock.name || "",
          period: selectedPeriod,
          decimal: Number((payload && payload["decimal"]) || 2),
          rows
        };
      }

      function parseKlineRows(klines) {
        if (!Array.isArray(klines)) return [];
        return klines.map(item => {
          const parts = String(item || "").split(",");
          return {
            date: parts[0] || "",
            open: Number(parts[1]),
            close: Number(parts[2]),
            high: Number(parts[3]),
            low: Number(parts[4]),
            volume: Number(parts[5]),
            amount: Number(parts[6]),
            amplitude: Number(parts[7]),
            pctChange: Number(parts[8]),
            change: Number(parts[9]),
            turnover: Number(parts[10])
          };
        }).filter(row => row.date && [row.open, row.close, row.high, row.low].every(Number.isFinite));
      }

      function formatMarketValue(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return String(value || "-");
        if (Math.abs(number) >= 1e12) return `${trimFixed(number / 1e12)}万亿`;
        if (Math.abs(number) >= 1e8) return `${trimFixed(number / 1e8)}亿`;
        if (Math.abs(number) >= 1e4) return `${trimFixed(number / 1e4)}万`;
        return trimFixed(number);
      }

      function trimFixed(value) {
        return Number(value).toFixed(2).replace(/\.?0+$/, "");
      }

      function formatQuoteDateTime(epochSeconds) {
        const parts = quoteTimeParts(epochSeconds);
        return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
      }

      function formatQuoteMinute(epochSeconds) {
        const parts = quoteTimeParts(epochSeconds);
        return `${parts.hour}:${parts.minute}`;
      }

      function quoteTimeParts(epochSeconds) {
        const date = new Date(Number(epochSeconds) * 1000);
        const parts = new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).formatToParts(date);
        return Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, part.value]));
      }

      function setMeta() {
        const remoteTotal = activeSource.total || rows.length;
        document.getElementById("remoteCount").textContent = String(remoteTotal);
        document.getElementById("quoteTime").textContent = activeSource.quoteTime || activeSource.searchCodeTime || "-";
        document.getElementById("sourceId").textContent = activeSource.originalXcId || activeSource.resultXcId || sourceMeta.originalXcId || "-";
        document.getElementById("sourceLink").href = activeSource.sourceUrl || sourceMeta.sourceUrl || "#";
      }

      function buildDisplayGroups(columns) {
        const seenColumnKeys = new Set();
        const groups = columns.reduce((result, column) => {
          if (isHiddenColumn(column)) return result;
          if (Array.isArray(column.children) && column.children.length) {
            const children = column.children.filter(child => keepDisplayColumn(child, seenColumnKeys));
            if (children.length) result.push({ title: column.title, children });
          } else {
            if (keepDisplayColumn(column, seenColumnKeys)) result.push({ title: column.title, column });
          }
          return result;
        }, []);
        return orderDisplayGroups(groupIntervalChangeColumns(groupGrowthRateColumns(groupDividendMetricColumns(groupReportMetricColumns(groupRealtimeQuoteColumns(groupContractLiabilityColumns(groups)))))));
      }

      function keepDisplayColumn(column, seenColumnKeys) {
        if (isHiddenColumn(column)) return false;
        const key = String(column.key || "");
        if (!key) return true;
        if (seenColumnKeys.has(key)) return false;
        seenColumnKeys.add(key);
        return true;
      }

      function groupContractLiabilityColumns(groups) {
        if (groups.some(group => group.title === "合同负债" && Array.isArray(group.children) && group.children.length)) {
          return groups;
        }
        const contractChildren = [];
        const orderedGroups = [];
        let insertAt = -1;
        groups.forEach(group => {
          const columns = group.children || [group.column];
          const isContractGroup = columns.length && columns.every(column => isContractLiabilityKey(column.key));
          if (isContractGroup) {
            if (insertAt < 0) insertAt = orderedGroups.length;
            contractChildren.push(...columns);
            return;
          }
          orderedGroups.push(group);
        });
        if (!contractChildren.length) return groups;
        const contractGroup = {
          title: "合同负债",
          children: contractChildren
        };
        const safeInsertAt = insertAt < 0 ? orderedGroups.length : insertAt;
        orderedGroups.splice(safeInsertAt, 0, contractGroup);
        return orderedGroups;
      }

      function isContractLiabilityKey(key) {
        return String(key || "").startsWith("CONTRACTLIAB");
      }

      function groupRealtimeQuoteColumns(groups) {
        const quoteColumns = [];
        const otherGroups = [];
        groups.forEach(group => {
          if (!group.children && group.column && realtimeQuoteKeys.includes(group.column.key)) {
            quoteColumns.push(group.column);
            return;
          }
          otherGroups.push(group);
        });
        if (!quoteColumns.length) return groups;
        const children = realtimeQuoteKeys
          .map(key => quoteColumns.find(column => column.key === key))
          .filter(Boolean);
        return [
          ...otherGroups,
          {
            title: realtimeQuoteGroupTitle(children),
            children,
            childLabelMode: "title"
          }
        ];
      }

      function groupReportMetricColumns(groups) {
        const metricColumns = [];
        const otherGroups = [];
        const seenKeys = new Set();
        groups.forEach(group => {
          const columns = group.children || [group.column];
          const reportColumns = columns.filter(column => column && isReportMetricColumn(column.key));
          if (reportColumns.length) {
            reportColumns.forEach(column => {
              if (seenKeys.has(column.key)) return;
              seenKeys.add(column.key);
              metricColumns.push(column);
            });
            const remainingColumns = columns.filter(column => column && !isReportMetricColumn(column.key));
            if (remainingColumns.length) {
              if (group.children) {
                otherGroups.push({ ...group, children: remainingColumns });
              } else {
                otherGroups.push({ title: group.title, column: remainingColumns[0] });
              }
            }
            return;
          }
          otherGroups.push(group);
        });
        if (!metricColumns.length) return groups;
        const children = reportMetricPrefixes
          .map(prefix => latestReportMetricColumnForPrefix(metricColumns, prefix))
          .filter(Boolean);
        if (!children.length) return otherGroups;
        return [
          ...otherGroups,
          {
            title: latestReportMetricGroupTitle(children),
            children,
            childLabelMode: "title"
          }
        ];
      }

      function groupDividendMetricColumns(groups) {
        const dividendColumns = [];
        const otherGroups = [];
        const seenKeys = new Set();
        groups.forEach(group => {
          const columns = group.children || [group.column];
          const matchedColumns = columns.filter(column => column && isDividendMetricColumn(column.key));
          if (matchedColumns.length) {
            matchedColumns.forEach(column => {
              if (seenKeys.has(column.key)) return;
              seenKeys.add(column.key);
              dividendColumns.push(column);
            });
            const remainingColumns = columns.filter(column => column && !isDividendMetricColumn(column.key));
            if (remainingColumns.length) {
              if (group.children) {
                otherGroups.push({ ...group, children: remainingColumns });
              } else {
                otherGroups.push({ title: group.title, column: remainingColumns[0] });
              }
            }
            return;
          }
          otherGroups.push(group);
        });
        if (!dividendColumns.length) return groups;
        const children = dividendMetricPrefixes
          .map(prefix => latestReportMetricColumnForPrefix(dividendColumns, prefix))
          .filter(Boolean);
        if (!children.length) return otherGroups;
        return [
          ...otherGroups,
          {
            title: "分红指标",
            children,
            childLabelMode: "title"
          }
        ];
      }

      function latestReportMetricColumnForPrefix(columns, prefix) {
        return columns
          .filter(column => String(column.key || "").startsWith(prefix))
          .reduce((latest, column) => {
            if (!latest) return column;
            return reportDateSortValue(column) > reportDateSortValue(latest) ? column : latest;
          }, null);
      }

      function reportDateSortValue(column) {
        const parsed = parseReportDateValue(reportDateTitleText(column));
        return parsed ? parsed.time : -Infinity;
      }

      function groupGrowthRateColumns(groups) {
        const growthColumns = [];
        const otherGroups = [];
        groups.forEach(group => {
          if (!group.children && group.column && isGrowthRateColumn(group.column.key)) {
            growthColumns.push(group.column);
            return;
          }
          otherGroups.push(group);
        });
        if (!growthColumns.length) return groups;
        const children = growthColumns
          .filter(column => column)
          .sort((a, b) => displayOrderForKey(a.key) - displayOrderForKey(b.key));
        return [
          ...otherGroups,
          {
            title: latestReportMetricGroupTitle(children),
            children,
            childLabelMode: "title"
          }
        ];
      }

      function groupIntervalChangeColumns(groups) {
        const intervalColumns = [];
        const otherGroups = [];
        const seenDays = new Set();
        groups.forEach(group => {
          const columns = group.children || [group.column];
          const matchedColumns = columns.filter(column => column && isIntervalChangeColumn(column.key));
          if (matchedColumns.length) {
            matchedColumns.forEach(column => {
              const days = intervalChangeDaysForColumn(column);
              const uniqueKey = days || column.key;
              if (seenDays.has(uniqueKey)) return;
              seenDays.add(uniqueKey);
              intervalColumns.push(column);
            });
            const remainingColumns = columns.filter(column => column && !isIntervalChangeColumn(column.key));
            if (remainingColumns.length) {
              if (group.children) {
                otherGroups.push({ ...group, children: remainingColumns });
              } else {
                otherGroups.push({ title: group.title, column: remainingColumns[0] });
              }
            }
            return;
          }
          otherGroups.push(group);
        });
        if (!intervalColumns.length) return groups;
        const orderedColumns = intervalChangeDays
          .map(days => intervalColumns.find(column => intervalChangeDaysForColumn(column) === days))
          .filter(Boolean);
        const extraColumns = intervalColumns
          .filter(column => !intervalChangeDays.includes(intervalChangeDaysForColumn(column)))
          .sort((a, b) => intervalChangeDaysForColumn(a) - intervalChangeDaysForColumn(b));
        return [
          ...otherGroups,
          {
            title: "近N日涨跌幅",
            children: [...orderedColumns, ...extraColumns],
            childLabelMode: "title"
          }
        ];
      }

      function realtimeQuoteGroupTitle(columns) {
        return activeSource.realtimeQuoteTime ||
          activeSource.quoteTime ||
          activeSource.searchCodeTime ||
          (columns.find(column => headerSubtitle(column)) || {}).dateMsg ||
          "行情时间";
      }

      function isHiddenColumn(column) {
        if (!column || column["hiddenNeed"]) return true;
        return hiddenKeys.has(column.key) || String(column.key || "").startsWith("IFSTSTOCK");
      }

      function orderDisplayGroups(groups) {
        return groups
          .map((group, index) => ({ group, index, priority: displayOrderForGroup(group) }))
          .sort((a, b) => a.priority - b.priority || a.index - b.index)
          .map(item => item.group);
      }

      function displayOrderForGroup(group) {
        const columns = group.children || [group.column];
        return columns.reduce((priority, column) => Math.min(priority, displayOrderForKey(column.key)), 1000);
      }

      function displayOrderForKey(key) {
        if (key === "SERIAL") return 0;
        if (key === "SECURITY_CODE") return 1;
        if (key === "SECURITY_SHORT_NAME") return 2;
        if (key === "NEWEST_PRICE") return 3;
        if (key === "PE_DYNAMIC") return 4;
        if (key === "PB") return 5;
        if (String(key || "").startsWith("DIVIDEND_NEWRATIO_HYY")) return 6;
        if (String(key || "").startsWith("DIVIDEND_PAY_RATIO_HYA")) return 7;
        if (key === "TOAL_MARKET_VALUE<140>") return 8;
        if (String(key || "").startsWith("ROE_WEIGHT")) return 9;
        if (String(key || "").startsWith("XSMLL")) return 10;
        if (String(key || "").startsWith("XSJLL")) return 11;
        if (String(key || "").includes("同比增长率")) return 12;
        if (String(key || "").includes("环比增长率")) return 13;
        if (isIntervalChangeColumn(key)) return 1100;
        return 1000;
      }

      function getFilteredRows() {
        const keyword = searchInput.value.trim().toLowerCase();
        return rows.filter(row => {
          if (!passesNumericFilters(row)) return false;
          if (!keyword) return true;
          const haystack = [row["SECURITY_CODE"], row["SECURITY_SHORT_NAME"]].join(" ").toLowerCase();
          return haystack.includes(keyword);
        }).sort((a, b) => compareRows(a, b));
      }

      function findFilterColumnKey(filter) {
        const column = findFilterColumn(filter, activeSource);
        return column ? column.key : "";
      }

      function findFilterColumn(filter, source) {
        const columns = (source && source.columns) || [];
        if (filter.key) return columns.find(item => item.key === filter.key) || null;
        const column = columns.find(item => {
          const key = String(item.key || "");
          const title = String(item.title || "");
          if (filter.keyPrefix && key.startsWith(filter.keyPrefix)) return true;
          return Boolean(filter.titleIncludes && (key.includes(filter.titleIncludes) || title.includes(filter.titleIncludes)));
        });
        return column || null;
      }

      function readThreshold(input) {
        const raw = input.value.trim();
        if (!raw) return null;
        const value = Number(raw);
        return Number.isFinite(value) ? value : null;
      }

      function passesNumericFilters(row) {
        return localNumericFilters.every(filter => {
          const key = filterKeys[filter.id];
          const min = readThreshold(filter.minInput);
          const max = readThreshold(filter.maxInput);
          if (!key || (min === null && max === null)) return true;
          const value = numericValue(valueForNumericFilter(row, key));
          if (Number.isNaN(value)) return false;
          if (min !== null && value < min * filter.scale) return false;
          return max === null || value <= max * filter.scale;
        });
      }

      function valueForNumericFilter(row, key) {
        return row[key];
      }

      function clearNumericFilters(filters = numericFilters) {
        filters.forEach(filter => {
          if (filter.minInput) filter.minInput.value = "";
          if (filter.maxInput) filter.maxInput.value = "";
        });
      }

      function scheduleLiveUpdate(delay = 550, showLoading = false) {
        window.clearTimeout(liveTimer);
        if (showLoading) setLiveLoadingStatus();
        liveTimer = window.setTimeout(refreshLiveData, delay);
      }

      function setLiveLoadingStatus() {
        dataStatus = { type: "loading", error: "" };
        render();
      }

      async function refreshLiveData() {
        const requestId = ++liveRequestId;
        const query = buildLiveQuery();
        try {
          const liveSource = await fetchLiveSource(query);
          if (requestId !== liveRequestId) return;
          applyData(liveSource, { type: "live", error: "" });
        } catch (error) {
          if (requestId !== liveRequestId) return;
          applyData(emptySource, { type: "error", error: cleanError(error) });
        }
      }

      async function fetchLiveSource(query) {
        const apiData = await requestEastmoney(query);
        return enrichRealtimeQuoteData(normalizeEastmoneyResponse(apiData, query));
      }

      async function requestEastmoney(query) {
        const response = await fetch(stockApiUrl("/api/stocks", eastmoneySearchApi), {
          method: "POST",
          headers: {
            "Accept": "application/json, text/plain, */*",
            "Content-Type": "application/json;charset=UTF-8"
          },
          body: JSON.stringify(buildEastmoneyRequest(query))
        });
        const responseText = await response.text();
        if (!response.ok) {
          throw new Error(responseText || `HTTP ${response.status}`);
        }
        return parseJsonResponse(responseText, "选股接口返回格式异常");
      }

      function parseJsonResponse(text, fallbackMessage) {
        try {
          return JSON.parse(text);
        } catch {
          throw new Error(text ? `${fallbackMessage}: ${text.slice(0, 120)}` : fallbackMessage);
        }
      }

      function buildEastmoneyRequest(query) {
        return {
          ownSelectAll: false,
          allCode: false,
          calcAvgChg: false,
          keywordNew: query,
          pageSize: livePageSize,
          pageNo: 1,
          fingerprint: "local-static-page",
          gids: [],
          timestamp: Date.now(),
          requestId: createRequestId(),
          shareToGuba: false,
          dxInfoNew: [],
          extraCondition: null,
          ignoreRightsField: false,
          customDataNew: "",
          needAmbiguousSuggest: false,
          notExecuteCompute: false,
          client: "WEB"
        };
      }

      function buildLiveQuery() {
        const parts = [
          growthCondition("合同负债环比增长", qoqThresholdInput, document.getElementById("qoqMaxInput")),
          growthCondition("合同负债同比增长", yoyThresholdInput, document.getElementById("yoyMaxInput")),
          ...liveMetricQueryParts,
          ...intervalChangeQueryParts,
          "不要ST股及不要退市股",
          "不要北交所"
        ];
        return `${parts.filter(Boolean).join(";")};`;
      }

      function growthCondition(label, minInput, maxInput) {
        const minText = thresholdQueryText(minInput);
        const maxText = thresholdQueryText(maxInput);
        if (minText && maxText) return `${label}${minText}%到${maxText}%`;
        if (minText) return `${label}${minText}%`;
        if (maxText) return `${label}小于${maxText}%`;
        return "";
      }

      function thresholdQueryText(input) {
        const raw = input.value.trim();
        return raw && Number.isFinite(Number(raw)) ? raw : "";
      }

      function normalizeEastmoneyResponse(apiData, query) {
        const payload = apiData && apiData["data"];
        const result = payload && payload["result"];
        const apiRows = result && (result["dataList"] || result["rows"] || result["list"]);
        if (!result || !Array.isArray(apiRows) || !Array.isArray(result["columns"])) {
          throw new Error((apiData && apiData["msg"]) || "接口未返回表格数据");
        }
        const resultXcId = payload["xcId"] || sourceMeta.resultXcId;
        return {
          sourceUrl: resultXcId ? `https://xuangu.eastmoney.com/Result?id=${resultXcId}&a=edit_way&j=refreshUrl` : sourceMeta.sourceUrl,
          originalXcId: sourceMeta.originalXcId,
          resultXcId,
          query,
          quoteTime: payload["quoteTime"] || result["quoteTime"] || "",
          searchCodeTime: payload["searchCodeTime"] || payload["quoteTime"] || "",
          fetchedAt: new Date().toISOString(),
          total: result["total"] || apiRows.length,
          columns: result["columns"],
          rows: apiRows.map((row, index) => ({ ...row, SERIAL: String(index + 1) })),
          conditions: payload["responseConditionList"] || [],
          traceInfo: payload["traceInfo"] || null,
          rawMeta: result["meta"] || null
        };
      }

      function createRequestId() {
        const chars = "0123456789abcdef";
        let id = "";
        for (let i = 0; i < 32; i += 1) id += chars[Math.floor(Math.random() * chars.length)];
        return id;
      }

      function cleanError(error) {
        const message = String(error && error.message ? error.message : error).replace(/\s+/g, " ");
        if (/JSON parse error|Failed to fetch|Content type|NetworkError|CORS|HTTP/i.test(message)) return "接口暂时不可用";
        return message.slice(0, 90);
      }

      function compareRows(a, b) {
        const key = sortState.key;
        const direction = sortState.direction === "desc" ? -1 : 1;
        const av = a[key];
        const bv = b[key];
        const an = numericValue(av);
        const bn = numericValue(bv);
        if (!Number.isNaN(an) && !Number.isNaN(bn) && an !== bn) return (an - bn) * direction;
        return String(av || "").localeCompare(String(bv || ""), "zh-CN", { numeric: true }) * direction;
      }

      function render() {
        const filtered = getFilteredRows();
        table.innerHTML = `${renderHeader()}${renderBody(filtered)}`;
        updateStickyOffsets();
        setTableLoadingOverlay(dataStatus.type === "loading" && rows.length > 0);
        table.querySelectorAll("[data-sort-key]").forEach(button => {
          button.addEventListener("click", () => sortBy(button.dataset.sortKey));
        });
      }

      function updateStickyOffsets() {
        const serialColumn = table.querySelector("thead .sticky-serial");
        const codeColumn = table.querySelector("thead .sticky-code");
        const serialWidth = serialColumn ? Math.ceil(serialColumn.getBoundingClientRect().width) : 52;
        const codeWidth = codeColumn ? Math.ceil(codeColumn.getBoundingClientRect().width) : 74;
        table.style.setProperty("--sticky-code-left", `${serialWidth}px`);
        table.style.setProperty("--sticky-name-left", `${serialWidth + codeWidth}px`);
      }

      function setTableLoadingOverlay(isVisible) {
        tableLoadingOverlay.hidden = !isVisible;
        tableWrap.setAttribute("aria-busy", dataStatus.type === "loading" ? "true" : "false");
      }

      function attachChartPreviewEvents() {
        const previewEnter = event => {
          const preview = stockPreviewTargetFromEvent(event);
          if (!preview) return;
          const previousTarget = stockPreviewNameTargetFromTarget(event.relatedTarget);
          if (previousTarget === preview.target) return;
          queueChartPreview(preview.row, event, false);
        };
        const previewMove = event => {
          const preview = stockPreviewTargetFromEvent(event);
          if (!preview || preview.row !== chartState.rowElement) return;
          chartState.pointerX = event.clientX;
          chartState.pointerY = event.clientY;
          placeChartPopover(preview.row);
        };
        const previewLeave = event => {
          const target = stockPreviewNameTargetFromTarget(event.target);
          if (!target) return;
          const nextTarget = stockPreviewNameTargetFromTarget(event.relatedTarget);
          if (nextTarget === target || (event.relatedTarget && chartPopover.contains(event.relatedTarget))) return;
          scheduleHideChartPreview();
        };
        ["pointerover", "mouseover"].forEach(type => table.addEventListener(type, previewEnter));
        ["pointermove", "mousemove"].forEach(type => table.addEventListener(type, previewMove));
        ["pointerout", "mouseout"].forEach(type => table.addEventListener(type, previewLeave));
        chartPeriodButtons.forEach(button => {
          button.addEventListener("click", () => {
            const period = button.dataset.chartPeriod;
            if (!chartPeriods[period] || chartState.period === period) return;
            chartState.period = period;
            setActiveChartPeriod(period);
            if (!chartPopover.hidden && chartState.code) loadChartDataForCurrentPreview();
          });
        });
        chartPopover.addEventListener("pointerenter", cancelHideChartPreview);
        chartPopover.addEventListener("mouseenter", cancelHideChartPreview);
        chartPopover.addEventListener("pointerleave", scheduleHideChartPreview);
        chartPopover.addEventListener("mouseleave", scheduleHideChartPreview);
        tableWrap.addEventListener("scroll", hideChartPreview, { passive: true });
        window.addEventListener("resize", () => {
          if (chartPopover.hidden) return;
          placeChartPopover(chartState.rowElement);
          if (chartState.rows.length) renderKlineChart(chartState.rows, chartState.period);
        });
        document.addEventListener("keydown", event => {
          if (event.key === "Escape") hideChartPreview();
        });
      }

      function stockPreviewTargetFromEvent(event) {
        const target = stockPreviewNameTargetFromTarget(event && event.target);
        if (!target) return null;
        const row = stockRowFromTarget(target);
        return row ? { row, target } : null;
      }

      function stockPreviewNameTargetFromTarget(target) {
        if (!target || typeof target.closest !== "function") return null;
        const nameTarget = target.closest('[data-chart-preview-target="name"]');
        return nameTarget && table.contains(nameTarget) ? nameTarget : null;
      }

      function cancelHideChartPreview() {
        window.clearTimeout(chartState.hideTimer);
      }

      function stockRowFromTarget(target) {
        return target && typeof target.closest === "function" ? target.closest("tbody tr[data-stock-code]") : null;
      }

      function queueChartPreview(row, event, immediate) {
        window.clearTimeout(chartState.hoverTimer);
        window.clearTimeout(chartState.hideTimer);
        window.clearTimeout(chartState.hideCommitTimer);
        chartState.pointerX = event && Number.isFinite(event.clientX) ? event.clientX : 0;
        chartState.pointerY = event && Number.isFinite(event.clientY) ? event.clientY : 0;
        if (immediate) {
          showChartPreview(row);
          return;
        }
        chartState.hoverTimer = window.setTimeout(() => showChartPreview(row), chartHoverDelayMs);
      }

      function showChartPreview(row) {
        if (!row || !row.dataset.stockCode) return;
        const code = row.dataset.stockCode;
        const market = row.dataset.stockMarket || marketCodeForRow({ SECURITY_CODE: code });
        const name = row.dataset.stockName || code;
        const rowData = rowDataForPreview(code);
        const stockChanged = chartState.code !== code || chartState.market !== market;
        chartState.rowElement = row;
        chartState.code = code;
        chartState.market = market;
        chartState.name = name;
        if (stockChanged) chartState.period = "101";
        chartPopover.hidden = false;
        chartPopover.setAttribute("aria-hidden", "false");
        chartPopover.classList.add("is-visible");
        setActiveChartPeriod(chartState.period);
        setChartHeader({ code, market, name, rowData });
        placeChartPopover(row);
        loadChartDataForCurrentPreview();
      }

      function rowDataForPreview(code) {
        return rows.find(row => String(row["SECURITY_CODE"] || "") === String(code || "")) || null;
      }

      function setChartHeader(stock) {
        chartTitle.textContent = stock.name || "-";
        chartCode.textContent = `${marketLabel(stock.market)}${stock.code}`;
        const rowData = stock.rowData || null;
        const latestPrice = numericValue(rowData && rowData["NEWEST_PRICE"]);
        const quoteChange = numericValue(rowData && rowData["CHG"]);
        const quotePctChange = numericValue(rowData && rowData["PCHG"]);
        chartPrice.textContent = Number.isNaN(latestPrice) ? "-" : formatPrice(latestPrice);
        chartChange.textContent = !Number.isNaN(quotePctChange)
          ? formatSignedPercent(quotePctChange)
          : (!Number.isNaN(quoteChange) ? formatSignedNumber(quoteChange) : "-");
        setTone(chartPrice, !Number.isNaN(quoteChange) ? quoteChange : quotePctChange);
        setTone(chartChange, !Number.isNaN(quotePctChange) ? quotePctChange : quoteChange);
        chartStatus.textContent = `${chartPeriods[chartState.period].label} 前复权`;
        setChartMeta(null);
        showChartMessage("正在加载K线...");
        drawEmptyKlineChart();
      }

      function marketLabel(market) {
        return String(market) === "1" ? "SH" : "SZ";
      }

      function scheduleHideChartPreview() {
        window.clearTimeout(chartState.hoverTimer);
        window.clearTimeout(chartState.hideTimer);
        chartState.hideTimer = window.setTimeout(hideChartPreview, chartHideDelayMs);
      }

      function hideChartPreview() {
        window.clearTimeout(chartState.hoverTimer);
        window.clearTimeout(chartState.hideTimer);
        if (chartState.abortController) {
          chartState.abortController.abort();
          chartState.abortController = null;
        }
        chartState.rowElement = null;
        chartState.rows = [];
        chartPopover.classList.remove("is-visible");
        chartPopover.setAttribute("aria-hidden", "true");
        window.clearTimeout(chartState.hideCommitTimer);
        chartState.hideCommitTimer = window.setTimeout(() => {
          if (!chartPopover.classList.contains("is-visible")) chartPopover.hidden = true;
        }, 130);
      }

      function setActiveChartPeriod(period) {
        chartPeriodButtons.forEach(button => {
          const isActive = button.dataset.chartPeriod === period;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-selected", isActive ? "true" : "false");
        });
      }

      async function loadChartDataForCurrentPreview() {
        const requestId = ++chartRequestId;
        const stock = {
          code: chartState.code,
          market: chartState.market,
          name: chartState.name
        };
        const period = chartState.period;
        const cacheKey = `${stock.market}.${stock.code}.${period}`;
        const cached = chartCache.get(cacheKey);
        chartState.rows = [];
        setChartHeader({ ...stock, rowData: rowDataForPreview(stock.code) });
        chartStatus.textContent = `${chartPeriods[period].label} 前复权，正在加载`;
        showChartMessage("正在加载K线...");
        drawEmptyKlineChart();
        if (cached) {
          renderChartData(cached);
          return;
        }
        if (chartState.abortController) chartState.abortController.abort();
        chartState.abortController = new AbortController();
        try {
          const data = await requestEastmoneyKlines(stock, period, chartState.abortController.signal);
          if (requestId !== chartRequestId || stock.code !== chartState.code || period !== chartState.period) return;
          chartCache.set(cacheKey, data);
          renderChartData(data);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          if (requestId !== chartRequestId) return;
          chartState.rows = [];
          chartStatus.textContent = `${chartPeriods[period].label} 前复权，加载失败`;
          setChartMeta(null);
          showChartMessage(cleanKlineError(error));
          drawEmptyKlineChart();
        } finally {
          if (requestId === chartRequestId) chartState.abortController = null;
        }
      }

      function renderChartData(data) {
        if (!data || !Array.isArray(data.rows) || !data.rows.length) {
          chartState.rows = [];
          chartStatus.textContent = `${chartPeriods[chartState.period].label} 前复权，暂无数据`;
          setChartMeta(null);
          showChartMessage("暂无K线数据");
          drawEmptyKlineChart();
          return;
        }
        const visibleRows = data.rows.slice(-chartPeriods[data.period].limit);
        const summary = chartSummary(visibleRows);
        chartState.rows = visibleRows;
        chartTitle.textContent = data.name || chartState.name || "-";
        chartCode.textContent = `${marketLabel(data.market)}${data.code || chartState.code}`;
        chartPrice.textContent = formatPrice(summary.close, data.decimal);
        chartChange.textContent = `${formatSignedNumber(summary.change)} ${formatSignedPercent(summary.pctChange)}`;
        setTone(chartPrice, summary.change);
        setTone(chartChange, summary.change);
        chartStatus.textContent = `${chartPeriods[data.period].label} 前复权 ${visibleRows[0].date} 至 ${summary.date}`;
        setChartMeta(summary);
        hideChartMessage();
        renderKlineChart(visibleRows, data.period);
      }

      function chartSummary(dataRows) {
        const latest = dataRows[dataRows.length - 1];
        const previous = dataRows[dataRows.length - 2] || null;
        const fallbackChange = previous ? latest.close - previous.close : 0;
        const change = Number.isFinite(latest.change) ? latest.change : fallbackChange;
        const pctChange = Number.isFinite(latest.pctChange) ? latest.pctChange : (previous && previous.close ? change / previous.close * 100 : 0);
        const ma5 = calculateMovingAverage(dataRows, 5);
        const ma10 = calculateMovingAverage(dataRows, 10);
        const ma20 = calculateMovingAverage(dataRows, 20);
        return {
          ...latest,
          change,
          pctChange,
          ma5: lastFiniteValue(ma5),
          ma10: lastFiniteValue(ma10),
          ma20: lastFiniteValue(ma20)
        };
      }

      function setChartMeta(summary) {
        chartOpen.textContent = `开 ${summary ? formatPrice(summary.open) : "-"}`;
        chartHigh.textContent = `高 ${summary ? formatPrice(summary.high) : "-"}`;
        chartLow.textContent = `低 ${summary ? formatPrice(summary.low) : "-"}`;
        chartAmount.textContent = `额 ${summary ? formatAmount(summary.amount) : "-"}`;
        chartMa5.textContent = `MA5 ${summary && Number.isFinite(summary.ma5) ? formatPrice(summary.ma5) : "-"}`;
        chartMa10.textContent = `MA10 ${summary && Number.isFinite(summary.ma10) ? formatPrice(summary.ma10) : "-"}`;
        chartMa20.textContent = `MA20 ${summary && Number.isFinite(summary.ma20) ? formatPrice(summary.ma20) : "-"}`;
      }

      function placeChartPopover(row) {
        if (!row || chartPopover.hidden) return;
        const margin = 12;
        const rect = row.getBoundingClientRect();
        const popoverWidth = chartPopover.offsetWidth || 590;
        const popoverHeight = chartPopover.offsetHeight || 450;
        const pointerX = chartState.pointerX || rect.left + rect.width / 2;
        const sideSpace = window.innerWidth - rect.right;
        let left = sideSpace >= popoverWidth + margin ? rect.right + 8 : pointerX + 18;
        if (left + popoverWidth > window.innerWidth - margin) left = rect.left - popoverWidth - 8;
        if (left < margin) left = Math.max(margin, window.innerWidth - popoverWidth - margin);
        let top = rect.top - 22;
        if (top + popoverHeight > window.innerHeight - margin) top = window.innerHeight - popoverHeight - margin;
        if (top < margin) top = margin;
        chartPopover.style.left = `${Math.round(left)}px`;
        chartPopover.style.top = `${Math.round(top)}px`;
      }

      function showChartMessage(message) {
        chartMessage.textContent = message || "";
        chartMessage.classList.add("is-visible");
      }

      function hideChartMessage() {
        chartMessage.classList.remove("is-visible");
      }

      function cleanKlineError(error) {
        const message = String(error && error.message ? error.message : error).replace(/\s+/g, " ");
        if (/Failed to fetch|NetworkError|CORS|abort|HTTP|JSON/i.test(message)) return "K线加载失败，稍后再试";
        return message.slice(0, 80) || "K线加载失败，稍后再试";
      }

      function drawEmptyKlineChart() {
        const canvasSize = prepareCanvas();
        const ctx = canvasSize.ctx;
        ctx.clearRect(0, 0, canvasSize.width, canvasSize.height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvasSize.width, canvasSize.height);
        drawChartGrid(ctx, 46, 20, canvasSize.width - 66, canvasSize.height - 74, 4, 4);
      }

      function renderKlineChart(dataRows, period) {
        const canvasSize = prepareCanvas();
        const ctx = canvasSize.ctx;
        const width = canvasSize.width;
        const height = canvasSize.height;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        if (!Array.isArray(dataRows) || !dataRows.length) {
          drawEmptyKlineChart();
          return;
        }
        const rowsToDraw = dataRows.slice(-chartPeriods[period].limit);
        const ma5 = calculateMovingAverage(rowsToDraw, 5);
        const ma10 = calculateMovingAverage(rowsToDraw, 10);
        const ma20 = calculateMovingAverage(rowsToDraw, 20);
        const plot = {
          x: 46,
          y: 20,
          w: width - 66,
          h: Math.max(160, Math.round(height * 0.62))
        };
        const volume = {
          x: plot.x,
          y: plot.y + plot.h + 30,
          w: plot.w,
          h: Math.max(52, height - plot.y - plot.h - 48)
        };
        const priceValues = rowsToDraw.flatMap(row => [row.high, row.low])
          .concat(ma5, ma10, ma20)
          .filter(Number.isFinite);
        const maxPrice = Math.max(...priceValues);
        const minPrice = Math.min(...priceValues);
        const pricePadding = Math.max((maxPrice - minPrice) * 0.08, maxPrice * 0.004, 0.01);
        const topPrice = maxPrice + pricePadding;
        const bottomPrice = Math.max(0, minPrice - pricePadding);
        const maxVolume = Math.max(...rowsToDraw.map(row => Number(row.volume) || 0), 1);
        const priceToY = price => plot.y + (topPrice - price) / (topPrice - bottomPrice || 1) * plot.h;
        const volumeToY = value => volume.y + volume.h - (Number(value) || 0) / maxVolume * volume.h;
        drawChartGrid(ctx, plot.x, plot.y, plot.w, plot.h, 4, 4);
        drawChartGrid(ctx, volume.x, volume.y, volume.w, volume.h, 2, 4);
        drawPriceLabels(ctx, plot, topPrice, bottomPrice);
        drawDateLabels(ctx, rowsToDraw, volume);
        const step = plot.w / rowsToDraw.length;
        const candleWidth = Math.max(3, Math.min(9, step * 0.58));
        rowsToDraw.forEach((row, index) => {
          const x = plot.x + step * index + step / 2;
          const isUp = row.close >= row.open;
          const color = isUp ? "#d8343f" : "#118a55";
          const highY = priceToY(row.high);
          const lowY = priceToY(row.low);
          const openY = priceToY(row.open);
          const closeY = priceToY(row.close);
          const top = Math.min(openY, closeY);
          const bodyHeight = Math.max(1, Math.abs(closeY - openY));
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, highY);
          ctx.lineTo(x, lowY);
          ctx.stroke();
          ctx.fillRect(x - candleWidth / 2, top, candleWidth, bodyHeight);
          const volumeTop = volumeToY(row.volume);
          ctx.globalAlpha = 0.78;
          ctx.fillRect(x - candleWidth / 2, volumeTop, candleWidth, volume.y + volume.h - volumeTop);
          ctx.globalAlpha = 1;
        });
        drawMovingAverage(ctx, ma5, rowsToDraw, plot, priceToY, "#c98600");
        drawMovingAverage(ctx, ma10, rowsToDraw, plot, priceToY, "#df3fd1");
        drawMovingAverage(ctx, ma20, rowsToDraw, plot, priceToY, "#3d9a62");
        drawLatestPriceLine(ctx, rowsToDraw[rowsToDraw.length - 1].close, plot, priceToY);
        ctx.fillStyle = "#65758b";
        ctx.font = "12px Microsoft YaHei, Arial, sans-serif";
        ctx.fillText("成交量", volume.x, volume.y - 8);
      }

      function prepareCanvas() {
        const rect = chartCanvas.getBoundingClientRect();
        const width = Math.max(320, Math.round(rect.width || 556));
        const height = Math.max(240, Math.round(rect.height || 328));
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        chartCanvas.width = Math.round(width * dpr);
        chartCanvas.height = Math.round(height * dpr);
        const ctx = chartCanvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        return { ctx, width, height };
      }

      function drawChartGrid(ctx, x, y, width, height, rowsCount, columnsCount) {
        ctx.strokeStyle = "#edf1f7";
        ctx.lineWidth = 1;
        for (let index = 0; index <= rowsCount; index += 1) {
          const lineY = y + height / rowsCount * index;
          ctx.beginPath();
          ctx.moveTo(x, lineY);
          ctx.lineTo(x + width, lineY);
          ctx.stroke();
        }
        for (let index = 0; index <= columnsCount; index += 1) {
          const lineX = x + width / columnsCount * index;
          ctx.beginPath();
          ctx.moveTo(lineX, y);
          ctx.lineTo(lineX, y + height);
          ctx.stroke();
        }
      }

      function drawPriceLabels(ctx, plot, topPrice, bottomPrice) {
        ctx.fillStyle = "#65758b";
        ctx.font = "11px Microsoft YaHei, Arial, sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (let index = 0; index <= 4; index += 1) {
          const value = topPrice - (topPrice - bottomPrice) / 4 * index;
          const y = plot.y + plot.h / 4 * index;
          ctx.fillText(formatPrice(value), plot.x - 7, y);
        }
        ctx.textAlign = "left";
      }

      function drawDateLabels(ctx, dataRows, volume) {
        if (!dataRows.length) return;
        ctx.fillStyle = "#65758b";
        ctx.font = "11px Microsoft YaHei, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const markers = [0, Math.floor(dataRows.length / 3), Math.floor(dataRows.length * 2 / 3), dataRows.length - 1];
        const uniqueMarkers = [...new Set(markers)].filter(index => index >= 0 && index < dataRows.length);
        uniqueMarkers.forEach(index => {
          const x = volume.x + volume.w / dataRows.length * index + volume.w / dataRows.length / 2;
          ctx.fillText(shortChartDate(dataRows[index].date), x, volume.y + volume.h + 8);
        });
        ctx.textAlign = "left";
      }

      function drawMovingAverage(ctx, values, dataRows, plot, priceToY, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        let hasPoint = false;
        const step = plot.w / dataRows.length;
        values.forEach((value, index) => {
          if (!Number.isFinite(value)) return;
          const x = plot.x + step * index + step / 2;
          const y = priceToY(value);
          if (!hasPoint) {
            ctx.moveTo(x, y);
            hasPoint = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        if (hasPoint) ctx.stroke();
      }

      function drawLatestPriceLine(ctx, price, plot, priceToY) {
        if (!Number.isFinite(price)) return;
        const y = priceToY(price);
        ctx.save();
        ctx.strokeStyle = "rgba(36, 84, 214, 0.38)";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(plot.x, y);
        ctx.lineTo(plot.x + plot.w, y);
        ctx.stroke();
        ctx.restore();
      }

      function calculateMovingAverage(dataRows, period) {
        let sum = 0;
        return dataRows.map((row, index) => {
          sum += row.close;
          if (index >= period) sum -= dataRows[index - period].close;
          return index >= period - 1 ? sum / period : null;
        });
      }

      function lastFiniteValue(values) {
        for (let index = values.length - 1; index >= 0; index -= 1) {
          if (Number.isFinite(values[index])) return values[index];
        }
        return NaN;
      }

      function shortChartDate(value) {
        const parts = String(value || "").split("-");
        if (parts.length < 3) return value || "";
        return `${parts[1]}-${parts[2]}`;
      }

      function formatPrice(value, decimal = 2) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "-";
        return number.toFixed(decimal).replace(/\.?0+$/, "");
      }

      function formatSignedNumber(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "-";
        const prefix = number > 0 ? "+" : "";
        return `${prefix}${formatPrice(number)}`;
      }

      function formatSignedPercent(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "-";
        const prefix = number > 0 ? "+" : "";
        return `${prefix}${formatPrice(number)}%`;
      }

      function formatAmount(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "-";
        if (Math.abs(number) >= 1e8) return `${trimFixed(number / 1e8)}亿`;
        if (Math.abs(number) >= 1e4) return `${trimFixed(number / 1e4)}万`;
        return trimFixed(number);
      }

      function setTone(element, value) {
        const number = Number(value);
        element.classList.remove("value-up", "value-down");
        if (!Number.isFinite(number) || number === 0) return;
        element.classList.add(number > 0 ? "value-up" : "value-down");
      }

      function renderHeader() {
        const firstRow = [];
        const secondRow = [];
        displayGroups.forEach(group => {
          if (group.children) {
            firstRow.push(`<th class="group-head" colspan="${group.children.length}"><div class="group-head-inner">${escapeHtml(group.title)}</div></th>`);
            group.children.forEach(column => {
              secondRow.push(renderHeaderCell(column, false, group.childLabelMode || "subtitle"));
            });
          } else {
            firstRow.push(renderHeaderCell(group.column, true, ""));
          }
        });
        return `<thead><tr>${firstRow.join("")}</tr><tr>${secondRow.join("")}</tr></thead>`;
      }

      function renderHeaderCell(column, rowSpan, childLabelMode) {
        const stickyClass = stickyClassFor(column.key);
        const widthClass = widthClassFor(column.key);
        const mark = sortState.key === column.key ? `<span class="sort-mark">${sortState.direction === "desc" ? "↓" : "↑"}</span>` : "";
        const cleanTitle = displayTitle(column);
        const subtitle = headerSubtitle(column);
        const label = childLabelMode === "title" ? cleanTitle : (childLabelMode ? (subtitle || cleanTitle) : cleanTitle);
        const date = childLabelMode ? "" : subtitle;
        return `
          <th class="${stickyClass} ${widthClass}" ${rowSpan ? 'rowspan="2"' : ""}>
            <button class="th-button" type="button" data-sort-key="${escapeAttr(column.key)}" title="${escapeAttr(cleanTitle)}">
              <span class="th-title">${escapeHtml(label)}${mark}</span>
              ${date ? `<span class="th-date">${escapeHtml(date)}</span>` : ""}
            </button>
          </th>`;
      }

      function renderBody(data) {
        if (!data.length) {
          const colspan = Math.max(1, leafColumns.length);
          if (dataStatus.type === "loading") {
            return `<tbody><tr><td class="empty-state" colspan="${colspan}">
              <span class="table-loading" role="status" aria-live="polite">
                <span class="table-loading-spinner" aria-hidden="true"></span>
                <span>正在获取东方财富实时数据...</span>
              </span>
            </td></tr></tbody>`;
          }
          const message = dataStatus.error
            ? `实时数据加载失败：${dataStatus.error}`
            : "没有匹配的股票。";
          return `<tbody><tr><td class="empty-state" colspan="${colspan}">${escapeHtml(message)}</td></tr></tbody>`;
        }
        const html = data.map(row => {
          const cells = leafColumns.map(column => renderCell(row, column)).join("");
          const stockCode = String(row["SECURITY_CODE"] || "").trim();
          const stockName = String(row["SECURITY_SHORT_NAME"] || "").trim();
          const market = marketCodeForRow(row);
          const rowAttrs = stockCode
            ? ` data-stock-code="${escapeAttr(stockCode)}" data-stock-market="${escapeAttr(market)}" data-stock-name="${escapeAttr(stockName)}"`
            : "";
          return `<tr${rowAttrs}>${cells}</tr>`;
        }).join("");
        return `<tbody>${html}</tbody>`;
      }

      function renderCell(row, column) {
        const key = column.key;
        const stickyClass = stickyClassFor(key);
        const widthClass = widthClassFor(key);
        const alignClass = alignClassFor(key);
        const toneClass = toneClassFor(row[key], column);
        const content = formatValue(row[key], column, row);
        return `<td class="${stickyClass} ${widthClass} ${alignClass} ${toneClass}">${content}</td>`;
      }

      function formatValue(value, column, row) {
        if (value === null || value === undefined || value === "") return "-";
        if (column.key === "SECURITY_CODE") {
          const detailUrl = quoteDetailUrlForRow(row);
          const codeText = escapeHtml(value);
          return detailUrl
            ? `<a class="stock-code" href="${escapeAttr(detailUrl)}" target="_blank" rel="noopener noreferrer">${codeText}</a>`
            : `<span class="stock-code">${codeText}</span>`;
        }
        if (column.key === "SECURITY_SHORT_NAME") return `<span class="stock-name" data-chart-preview-target="name">${escapeHtml(value)}</span>`;
        const parts = String(value).split("|");
        let main = parts[0] || "-";
        if (column.unit === "%" && main !== "-" && !main.includes("%")) main = `${main}%`;
        if (shouldHideReportSuffix(column)) return `<span class="cell-main">${escapeHtml(main)}</span>`;
        const sub = cellSubtitleForValue(parts.slice(1).join(" "), column);
        return `<span class="cell-main">${escapeHtml(main)}</span>${sub ? `<span class="cell-sub">${escapeHtml(sub)}</span>` : ""}`;
      }

      function cellSubtitleForValue(valueSuffix, column) {
        const explicit = String(valueSuffix || "").trim();
        if (explicit) return explicit;
        return dividendMetricCellSubtitle(column);
      }

      function dividendMetricCellSubtitle(column) {
        if (!column || !isDividendMetricColumn(column.key)) return "";
        return String(column.dateMsg || reportDateFromKey(column.key) || "").trim();
      }

      function sortBy(key) {
        if (sortState.key === key) {
          sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
        } else {
          sortState = { key, direction: "desc" };
        }
        render();
      }

      function displayTitle(column) {
        if (column.key === "TOAL_MARKET_VALUE<140>") return "总市值";
        if (column.key === "PE_DYNAMIC") return "市盈率(动)";
        if (column.key === "PB") return "市净率";
        if (isIntervalChangeColumn(column.key)) return intervalChangeTitle(column);
        if (String(column.key || "").includes("同比增长率")) return "合同负债同比增长率";
        if (String(column.key || "").includes("环比增长率")) return "合同负债环比增长率";
        if (String(column.key || "").startsWith("XSMLL")) return "毛利率";
        if (String(column.key || "").startsWith("XSJLL")) return "净利率";
        if (String(column.key || "").startsWith("ROE_WEIGHT")) return "净资产收益率";
        if (String(column.key || "").startsWith("DIVIDEND_NEWRATIO_HYY")) return "股息率";
        if (String(column.key || "").startsWith("DIVIDEND_PAY_RATIO_HYA")) return "股息支付率";
        return column.title;
      }

      function headerSubtitle(column) {
        if (isReportMetricColumn(column.key)) return reportPeriodForColumn(column.key) || column.dateMsg;
        return column.dateMsg;
      }

      function isReportMetricColumn(key) {
        const value = String(key || "");
        return reportMetricPrefixes.some(prefix => value.startsWith(prefix));
      }

      function isDividendMetricColumn(key) {
        const value = String(key || "");
        return dividendMetricPrefixes.some(prefix => value.startsWith(prefix));
      }

      function shouldHideReportSuffix(column) {
        return isReportMetricColumn(column.key) || isGrowthRateColumn(column.key);
      }

      function isGrowthRateColumn(key) {
        const value = String(key || "");
        return value.includes("同比增长率") || value.includes("环比增长率");
      }

      function isIntervalChangeColumn(key) {
        return String(key || "").startsWith("INTERVAL_CHG");
      }

      function intervalChangeTitle(column) {
        const days = intervalChangeDaysForColumn(column);
        return days ? `近${days}日` : (column.title || "区间涨跌幅");
      }

      function intervalChangeDaysForColumn(column) {
        const key = String(column && column.key ? column.key : column || "");
        const keyMatch = key.match(/INTERVAL_CHG[{][^}]*[|](\d+)[|]天[}]/);
        if (keyMatch) return Number(keyMatch[1]);
        const text = String(column && column.title ? column.title : "");
        const titleMatch = text.match(/近\s*(\d+)\s*日/);
        return titleMatch ? Number(titleMatch[1]) : 0;
      }

      function reportPeriodForColumn(key) {
        const row = rows.find(item => String(item[key] || "").includes("|"));
        if (!row) return "";
        return formatReportPeriod(String(row[key]).split("|").slice(1).join(" "));
      }

      function latestReportMetricGroupTitle(columns) {
        const latest = columns.reduce((result, column) => {
          const candidate = parseReportDateValue(reportDateTitleText(column));
          if (!candidate) return result;
          if (!result || candidate.time > result.time) return candidate;
          return result;
        }, null);
        if (latest) return latest.title;
        return parseReportDateValue(reportDateTitleText(columns[0]))?.title ||
          formatReportDateTitle(reportDateTitleText(columns[0])) ||
          "报表时间";
      }

      function reportDateTitleText(column) {
        if (!column) return "";
        return reportDateFromColumnValues(column) || column.dateMsg || reportDateFromKey(column.key) || "";
      }

      function reportDateFromColumnValues(column) {
        if (!column || !column.key) return "";
        return rows.reduce((latest, row) => {
          const value = String(row[column.key] || "");
          const reportText = value.includes("|") ? value.split("|").slice(1).join(" ") : "";
          const title = reportDateFromPeriodText(reportText);
          const candidate = parseReportDateValue(title);
          if (!candidate) return latest;
          return !latest || candidate.time > latest.time ? candidate : latest;
        }, null)?.title || "";
      }

      function reportDateFromPeriodText(value) {
        const text = String(value || "").trim();
        const exact = parseReportDateValue(text);
        if (exact) return exact.title;
        const match = text.match(/(\d{4})\s*年?\s*(一季报|中报|半年报|三季报|年报)/);
        if (!match) return "";
        const year = match[1];
        const period = match[2];
        if (period === "一季报") return `${year}.3.31`;
        if (period === "中报" || period === "半年报") return `${year}.6.30`;
        if (period === "三季报") return `${year}.9.30`;
        if (period === "年报") return `${year}.12.31`;
        return "";
      }

      function reportDateFromKey(key) {
        const match = String(key || "").match(/[{](\d{4})-(\d{2})-(\d{2})[}]/);
        if (!match) return "";
        return `${match[1]}.${match[2]}.${match[3]}`;
      }

      function parseReportDateValue(value) {
        const text = String(value || "").trim();
        const match = text.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
        if (!match) return null;
        const time = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        return {
          time,
          title: formatReportDateTitle(text)
        };
      }

      function formatReportDateTitle(value) {
        const text = String(value || "").trim();
        const match = text.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
        if (match) {
          return `${match[1]}.${Number(match[2])}.${Number(match[3])}`;
        }
        return text;
      }

      function formatReportPeriod(value) {
        const text = value.trim();
        const match = text.match(/^(\d{4})(.+)$/);
        return match ? `${match[1]}年 ${match[2].trim()}` : text;
      }

      function stickyClassFor(key) {
        if (key === "SERIAL") return "sticky-col sticky-serial";
        if (key === "SECURITY_CODE") return "sticky-col sticky-code";
        if (key === "SECURITY_SHORT_NAME") return "sticky-col sticky-name";
        return "";
      }

      function widthClassFor(key) {
        if (["SERIAL", "SECURITY_CODE", "SECURITY_SHORT_NAME"].includes(key)) return "";
        if (realtimeQuoteKeys.includes(key)) return "col-realtime";
        if (isIntervalChangeColumn(key)) return "col-interval-change";
        if (key.includes("同比增长率") || key.includes("环比增长率")) return "col-growth";
        if (key.startsWith("CONTRACTLIAB")) return "col-contract";
        return "col-wide";
      }

      function alignClassFor(key) {
        if (["SECURITY_CODE", "SECURITY_SHORT_NAME"].includes(key)) return "text-center";
        if (key === "SERIAL") return "text-center";
        return "";
      }

      function toneClassFor(value, column) {
        if (!column["redGreenAble"] && !isIntervalChangeColumn(column.key)) return "";
        const numeric = numericValue(value);
        if (Number.isNaN(numeric) || numeric === 0) return "";
        return numeric > 0 ? "value-up" : "value-down";
      }

      function numericValue(value) {
        if (value === null || value === undefined) return NaN;
        const raw = String(value).split("|")[0].replace(/,/g, "").trim();
        if (!raw || raw === "-") return NaN;
        const match = raw.match(/-?\d+(?:\.\d+)?/);
        if (!match) return NaN;
        let number = Number(match[0]);
        if (raw.includes("万亿")) number *= 1e12;
        else if (raw.includes("亿")) number *= 1e8;
        else if (raw.includes("万")) number *= 1e4;
        return number;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }
    })();
  </script>
</body>
</html>
